name: Renovar token do Instagram

on:
  # Todo dia 1o de cada mes, as 06:00 UTC (03:00 em Brasilia).
  # O token vale 60 dias, entao renovar mensalmente da margem de sobra.
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  renovar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Renovar token e atualizar o secret
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python renovar_token.py
